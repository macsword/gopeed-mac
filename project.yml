name: GopeedMac

options:
  bundleIdPrefix: com.macsword
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  GopeedMac:
    type: application
    platform: macOS
    sources:
      - path: GopeedMac
        excludes:
          - "Frameworks/*"
    info:
      path: GopeedMac/Info.plist
      properties:
        CFBundleDisplayName: GDM
        CFBundleName: GDM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSDownloadsFolderUsageDescription: GDM saves files to the folder you choose.
    settings:
      base:
        PRODUCT_NAME: GDM
        PRODUCT_BUNDLE_IDENTIFIER: com.macsword.gopeedmac
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: GopeedMac/Engine/GopeedMac-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/GopeedMac/Frameworks"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/GopeedMac/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lgopeed"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GopeedMac/GopeedMac.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - framework: GopeedMac/Frameworks/libgopeed.dylib
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Ensure Gopeed engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ ! -f "${PROJECT_DIR}/GopeedMac/Frameworks/libgopeed.dylib" ]; then
            "${PROJECT_DIR}/Scripts/build-engine.sh"
          fi

schemes:
  GopeedMac:
    build:
      targets:
        GopeedMac: all
    run:
      config: Debug
      executable: GopeedMac
    archive:
      config: Release
